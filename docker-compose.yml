services:
  poker:
    build:
      context: .
      dockerfile: Dockerfile
    image: poker-app:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      FRONTEND_DIST_PATH: "/app/poker-client/dist"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - poker_data:/app/data

volumes:
  poker_data:
