name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build poker-types
        run: pnpm --filter poker-types build

      - name: Build poker-client
        run: pnpm --filter poker-client build

      - name: Build poker-server
        run: pnpm --filter poker-server build

      - name: Run unit tests
        run: pnpm --filter poker-server exec jest --testPathIgnorePatterns=test/e2e/ --runInBand

      - name: Install Playwright (Chromium)
        run: pnpm --filter poker-server exec playwright install --with-deps chromium

      - name: Run critical smoke e2e
        run: pnpm --filter poker-server test:e2e:playwright:smoke
