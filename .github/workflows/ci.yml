name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/staging

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            poker-types/package-lock.json
            poker-client/package-lock.json
            poker-server/package-lock.json

      - name: Install poker-types deps
        run: npm ci
        working-directory: poker-types

      - name: Build poker-types
        run: npm run build
        working-directory: poker-types

      - name: Install poker-client deps
        run: npm ci
        working-directory: poker-client

      - name: Build poker-client
        run: npm run build
        working-directory: poker-client

      - name: Install poker-server deps
        run: npm ci
        working-directory: poker-server

      - name: Build poker-server
        run: npm run build
        working-directory: poker-server

      - name: Run unit tests
        run: npm run test:unit -- --runInBand
        working-directory: poker-server

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: poker-server

      - name: Run critical smoke e2e
        run: npm run test:e2e:playwright:smoke
        working-directory: poker-server
